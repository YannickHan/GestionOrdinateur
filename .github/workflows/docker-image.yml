name: GestionOrdinateurs

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:

  tests:
    runs-on: ubuntu-latest
  
    steps:
      - name: Checkout
        uses: actions/checkout@v5
  
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
  
      - name: Restore
        run: dotnet restore
  
      - name: Build solution
        run: dotnet build --no-restore
  
      - name: Run tests
        run: dotnet test GestionOrdinateurs.Tests/GestionOrdinateurs.Tests.csproj --no-build --verbosity normal

  build-applications:
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore GestionOrdinateurs.slnx

      - name: Build solution
        run: dotnet build GestionOrdinateurs.slnx --configuration Release --no-restore
